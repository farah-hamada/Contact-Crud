    <!----------------- start-modal ------------------->

    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable px-2 py-4 px-sm-0 py-sm-0">
            <div class="modal-content border-0 rounded-4 shadow-lg">

                <div class="modal-header py-3 px-4 border-0 d-flex justify-content-between align-items-center">
                    <h5 class="modal-title fw-bold fs-5 modal-add" id="addContactModalLabel">Add New Contact</h5>
                    <button type="button" class="btn custom-close-icon p-0 border-0" data-bs-dismiss="modal"
                        aria-label="Close">
                        <i class="fa-solid fa-xmark fa-sm"></i>
                    </button>
                </div>

                <div class="modal-body border-top -subtle">
                    <form>
                        <div class="d-flex flex-column align-items-center my-4">
                            <div class="avatar-circle d-flex align-items-center justify-content-center mb-3">
                                <i class="fa-solid fa-user text-white fs-2"></i>
                            </div>
                            <input type="file" id="imgInput" accept="image/*" class="d-none">
                            <button type="button" class="btn btn-sm px-3 py-2 rounded-3 fw-medium change-btn border-0"
                                id="img">
                                <i class="fa-solid fa-camera me-1"></i> Change Photo
                            </button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Full Name <span class="star">*</span></label>
                            <input type="text" class="form-control  rounded-4" placeholder="Enter full name" required
                                id="fullname">
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Phone Number <span class="star">*</span></label>
                            <input type="tel" class="form-control  rounded-4" placeholder="e.g., 01012345678" required
                                id="phonenumber">
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Email Address</label>
                            <input type="email" class="form-control  rounded-4" placeholder="name@example.com"
                                id="emailaddress">
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Address</label>
                            <input type="text" class="form-control  rounded-4" placeholder="Enter address" id="address">
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1">Group</label>
                            <select class="form-select form-control rounded-4" id="group">
                                <option selected disabled>Select a group</option>
                                <option value="family">Family</option>
                                <option value="friends">Friends</option>
                                <option value="work">Work</option>
                                <option value="school">School</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label mb-1">Notes</label>
                            <textarea class="form-control  rounded-4" rows="3"
                                placeholder="Add notes about this contact" id="notes"></textarea>
                        </div>

                        <div class="d-flex gap-4 mb-4">
                            <div class="form-check p-0 m-0">
                                <label class="form-check-label fw-medium custom-label d-flex align-items-center gap-1"
                                    for="favCheck">
                                    <input class="form-check-input custom-checkbox position-static m-0 me-1"
                                        type="checkbox" id="favCheck">
                                    <i class="fa-solid fa-star text-warning"></i> Favorite
                                </label>
                            </div>


                            <div class="form-check p-0 m-0">
                                <label class="form-check-label fw-medium custom-label d-flex align-items-center gap-1"
                                    for="emergencyCheck">
                                    <input class="form-check-input custom-checkbox position-static m-0 me-1"
                                        type="checkbox" id="emergencyCheck">
                                    <i class="fa-solid fa-heart-pulse star"></i> Emergency
                                </label>
                            </div>
                        </div>

                        <div
                            class="d-flex flex-column-reverse d-sm-flex flex-sm-row gap-2 justify-content-between py-2 border-0 ">

                            <button type="button"
                                class="btn btn-cancel w-100 w-sm-50 d-inline-flex align-items-center justify-content-center"
                                data-bs-dismiss="modal">
                                Cancel
                            </button>

                            <button type="button"
                                class="btn btn-save w-100 w-sm-50 d-inline-flex align-items-center justify-content-center gap-1"
                                data-bs-dismiss="modal" onclick="addNewContact(event)">
                                <i class="fa-solid fa-check fa-sm"></i> Save Contact
                            </button>

                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
